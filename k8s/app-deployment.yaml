apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-resume-app
  namespace: live-resume
spec:
  replicas: 2
  selector:
    matchLabels:
      app: live-resume-app
  template:
    metadata:
      labels:
        app: live-resume-app
    spec:
      containers:
        - name: live-resume-app
          image: saeedha/live-resume-devops:1.0
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
