name: Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/live-resume-devops:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/live-resume-devops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  push:
    name: Push to DockerHub
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/live-resume-devops:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/live-resume-devops:latest

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to k3s
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/

          kubectl set image deployment/live-resume-app \
            live-resume-app=${{ secrets.DOCKERHUB_USERNAME }}/live-resume-devops:${{ github.sha }} \
            -n live-resume

          kubectl rollout status deployment/live-resume-app -n live-resume
