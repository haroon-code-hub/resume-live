name: Build, Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/live-resume-devops:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/live-resume-devops:latest \
            --push .

      - name: Deploy to k3s server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            kubectl set image deployment/live-resume-app \
              live-resume-app=${{ secrets.DOCKERHUB_USERNAME }}/live-resume-devops:${{ github.sha }} \
              -n live-resume

            kubectl rollout status deployment/live-resume-app -n live-resume
